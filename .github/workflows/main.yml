name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Java sürümünü daha stabil olan Temurin ile güncelliyoruz
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Projeyi Hazırla ve APK Derle
        run: |
          flutter create power_app
          rm -rf power_app/lib
          cp -r lib power_app/
          cd power_app
          flutter pub add shared_preferences
          # Hatayı açıkça görmek için verbose (-v) parametresini ekledik
          flutter build apk --release -v

      - name: APK Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: ElektrikAsistani-APK
          path: power_app/build/app/outputs/flutter-apk/app-release.apk
