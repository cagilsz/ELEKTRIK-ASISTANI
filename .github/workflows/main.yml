name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Projeyi Gerçek Bir Flutter Projesine Çevir
        run: |
          # Bulunduğumuz klasörü resmi bir Flutter projesi yapıyoruz
          flutter create --org com.schneider.powerfield --project-name powerfield .
          
          # Eksik paketleri indiriyoruz
          flutter pub add shared_preferences
          flutter pub get

      - name: APK Derle
        run: flutter build apk --release

      - name: APK Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: ElektrikAsistani-APK
          path: build/app/outputs/flutter-apk/app-release.apk
